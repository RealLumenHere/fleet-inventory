identity: {name: maat, aliases: ["Ma'at"], make_model: "mini-PC (WeiBu ADL-N board)", serial: VERIFY, location: rack}
status:
  status: active
  power: on
  monitor: true
  monitoring: {interval_s: 60, alert: true, alert_desc: "maat unreachable — VAULT PRIMARY down", gatus: true}
network:
  tailscale_ip: 100.105.219.34
  lan_ip: 192.168.8.202
  ssh: {user: maam, method: key}
  nics: []
hardware:
  cpu: {model: Intel N-series (Alder Lake-N), cores: VERIFY, gen: ADL-N}
  ram: {size_gb: VERIFY, type: VERIFY, ceiling_gb: VERIFY}
  storage: [{type: VERIFY}]
  gpu: []
  board: {model: WeiBu ADL-N, bios: F2, quirks: "Restore-on-AC-Power-Loss does NOT persist (no nvram) — stays dead after any power event; needs physical power-on. Root cause of 07-15 + 09-03 multi-day outages."}
  power_hw: {psu_w: VERIFY, ups: true, plug_id: P4, ac_restore: "SET but does not hold (board quirk)", recovery: "PHYSICAL power button (won't auto-boot)"}
roles: [vault, ha-primary, pg-primary]
services: [vaultwarden (compose /opt/maat-vaultwarden), postgres]
serves: [Vaultwarden password vault; PG primary streaming to bes+sobek]
governance: {crown_jewel: true, never_restart: false, never_reboot_unless_recoverable: true, off_limits: false}
ops: {provisioned: VERIFY, last_verified: 2026-09-04, upgrades: [], known_issues: ["AC-restore quirk = one power blip -> multi-day dark vault; needs a board that holds the setting or an external auto-power-on module"]}
