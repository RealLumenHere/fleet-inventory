# TEMPLATE — copy to machines/<name>.yaml and replace every VERIFY. Files starting with "_"
# are ignored by the loader. Keep the 2-line provenance comment (seeded-from + date) on real files.
identity: {name: VERIFY, aliases: [], make_model: VERIFY, serial: VERIFY, location: VERIFY}
status:
  status: VERIFY              # active | standby | bench | in-storage | decommissioned | dead
  power: VERIFY               # on | off | plug-cut
  monitor: VERIFY             # true | false  (false => NO liveness sweep, NO alerts)
  monitoring: {interval_s: 60, alert: true, alert_desc: "", gatus: true}   # optional; defaults shown
  # decommissioned: {date: VERIFY, reason: VERIFY}   # required when status=decommissioned
network:
  tailscale_ip: VERIFY
  lan_ip: VERIFY
  ssh: {user: VERIFY, method: VERIFY}   # method: key / ts-ssh check-mode / LAN-only / n/a; optional key: /path/to/private_key
  nics: []                              # [{iface, mac, note}]  note "NEVER SPOOF" where it matters
hardware:
  cpu: {model: VERIFY, cores: VERIFY, gen: VERIFY}
  ram: {size_gb: VERIFY, type: VERIFY, speed: VERIFY, dimms_used: VERIFY, dimms_total: VERIFY, ceiling_gb: VERIFY}
  storage: [{type: VERIFY, size: VERIFY, interface: VERIFY, serial: VERIFY, bay: VERIFY}]
  gpu: []                               # [{model, vram_gb}]
  board: {model: VERIFY, bios: VERIFY, quirks: ""}
  power_hw: {psu_w: VERIFY, ups: VERIFY, plug_id: VERIFY, ac_restore: VERIFY, recovery: VERIFY}
roles: []
services: []
serves: []
governance: {crown_jewel: false, never_restart: false, off_limits: false}
ops: {provisioned: VERIFY, last_verified: VERIFY, upgrades: [], known_issues: []}   # + maint_tier: N when the box joins the maintenance window (SCHEMA.md ## ops)
